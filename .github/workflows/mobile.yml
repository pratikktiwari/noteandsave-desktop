name: Mobile

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/workspace/**"
      - "packages/workspace-codec/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/workspace/**"
      - "packages/workspace-codec/**"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run typecheck:mobile
      - run: npm run test:mobile
      - run: npm test
      - run: npx expo prebuild --platform android --no-install --clean
        working-directory: apps/mobile
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: noteandsave-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
